services:
  - type: web
    name: cybersahay-demo
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /
    envVars:
      - key: AUTH_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: cybersahay-demo-db
          property: connectionString

databases:
  - name: cybersahay-demo-db
    plan: free
    region: singapore
    ipAllowList: []
